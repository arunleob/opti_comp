[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "casadi-ccopt"
version = "0.1.0"
description = "Minimal complementarity helpers for CasADi Opti and CCOpt"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["casadi"]

[project.optional-dependencies]
test = ["numpy", "pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["casadi_ccopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
